version: "3.8"

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mariuszadamowicz/10x-todo:latest
    container_name: 10x-todo-webapp
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - 10x-network

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    image: ghcr.io/mariuszadamowicz/mcp-10x-todo:latest
    container_name: 10x-todo-mcp-server
    ports:
      - "8081:8081"
    env_file:
      - ./mcp-server/.env
    restart: unless-stopped
    networks:
      - 10x-network

networks:
  10x-network:
    driver: bridge
