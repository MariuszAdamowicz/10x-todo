name: Production Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare_deployment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup and Install
        uses: ./.github/actions/setup

      - name: Run Lint
        run: npm run lint

  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup and Install
        uses: ./.github/actions/setup

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage

      - name: Upload Unit Test Coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup and Install
        uses: ./.github/actions/setup

      - name: Build Project
        run: npm run build

      - name: Create Cloudflare Pages project if missing
        run: npx wrangler pages project create 10x-todo --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist

  deploy-mcp:
    name: Deploy MCP Server
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup and Install
        uses: ./.github/actions/setup

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp-server
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  summary:
    name: Deployment Summary
    needs: [deploy, deploy-mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Display URLs
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend App** | https://10x-todo.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **MCP Server** | https://10x-todo-mcp.${{ vars.CLOUDFLARE_SUBDOMAIN || 'mariuszadamowicz' }}.workers.dev/sse |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Remember to configure your \`TODO_API_KEY\` in the Cloudflare Worker settings for MCP to work correctly." >> $GITHUB_STEP_SUMMARY
