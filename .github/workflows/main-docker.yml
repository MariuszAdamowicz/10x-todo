name: Production Build & Deploy

on:
  workflow_dispatch: # Manual trigger

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage

  build-and-deploy:
    name: Build, Push & Deploy
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Main App
      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mariuszadamowicz/10x-todo:latest
            ghcr.io/mariuszadamowicz/10x-todo:${{ github.sha }}
          build-args: |
            PUBLIC_ENV_NAME=${{ secrets.PUBLIC_ENV_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push MCP Server
      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mariuszadamowicz/mcp-10x-todo:latest
            ghcr.io/mariuszadamowicz/mcp-10x-todo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy Triggers
      - name: Deploy App to Render
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_APP }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_APP }}"
          else
            echo "::warning::RENDER_DEPLOY_HOOK_URL_APP is not set. Skipping App deploy."
          fi

      - name: Deploy MCP to Render
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_MCP }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_MCP }}"
          else
            echo "::warning::RENDER_DEPLOY_HOOK_URL_MCP is not set. Skipping MCP deploy."
          fi
